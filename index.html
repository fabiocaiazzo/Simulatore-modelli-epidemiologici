    window.openNodeSettings = () => {
        if (customModel.nodes.length === 0) {
            alert("Aggiungi almeno un compartimento prima di aprire le impostazioni.");
            return;
        }
        if (editingNodeIdx === null || editingNodeIdx >= customModel.nodes.length) {
            editingNodeIdx = 0; // Default al primo compartimento
        }
        
        populateNodeSelect();
        loadNodeData(editingNodeIdx);
        document.getElementById('nodeModal').style.display = 'flex';
    };

    window.populateNodeSelect = () => {
        const select = document.getElementById('nodeSelect');
        select.innerHTML = customModel.nodes.map((n, i) => 
            `<option value="${i}">${n.id}</option>`
        ).join('');
        select.value = editingNodeIdx;
    };

    window.switchSettingsNode = (newIdx) => {
        saveCurrentNodeData(); // Salva modifiche prima di cambiare nodo
        editingNodeIdx = parseInt(newIdx);
        loadNodeData(editingNodeIdx);
    };

    window.loadNodeData = (idx) => {
        const node = customModel.nodes[idx];
        if(node.infectMult === undefined) node.infectMult = 1;
        if(node.canReproduce === undefined) node.canReproduce = true; // Default attivo
        if(!node.overflow) node.overflow = [];

        document.getElementById('setStatic').checked = node.isStatic || false;
        document.getElementById('setIsolated').checked = node.isIsolated || false;
        document.getElementById('setCanReproduce').checked = node.canReproduce;
        document.getElementById('setInfectMult').value = node.infectMult;
        document.getElementById('setCapacity').value = node.capacity || '';
        
        renderOverflowRules(idx);
    };

    window.saveCurrentNodeData = () => {
        if (editingNodeIdx === null || !customModel.nodes[editingNodeIdx]) return;
        const node = customModel.nodes[editingNodeIdx];
        node.isStatic = document.getElementById('setStatic').checked;
        node.isIsolated = document.getElementById('setIsolated').checked;
        node.canReproduce = document.getElementById('setCanReproduce').checked;
        node.infectMult = parseFloat(document.getElementById('setInfectMult').value);
        const cap = parseInt(document.getElementById('setCapacity').value);
        node.capacity = isNaN(cap) ? null : cap;
    };

    window.renderOverflowRules = (idx) => {
        const node = customModel.nodes[idx];
        const overflowList = document.getElementById('overflowRulesList');
        overflowList.innerHTML = '';
        const others = customModel.nodes.filter((n, i) => i !== idx);
        
        node.overflow.forEach((rule, rIdx) => {
            const row = document.createElement('div');
            row.className = 'overflow-rule';
            row.innerHTML = `
                <select onchange="updateOverflow(${rIdx}, 'to', this.value)">
                    ${others.map(n => `<option value="${n.id}" ${n.id === rule.to ? 'selected' : ''}>${n.id}</option>`).join('')}
                </select>
                <input type="number" step="0.1" min="0" max="1" value="${rule.rate}" style="width:60px" onchange="updateOverflow(${rIdx}, 'rate', this.value)">
                <button class="btn-remove" onclick="removeOverflow(${rIdx})">×</button>
            `;
            overflowList.appendChild(row);
        });
    };

    window.closeNodeSettings = () => {
        saveCurrentNodeData();
        document.getElementById('nodeModal').style.display = 'none';
        renderEditor();
    };

    window.addOverflowRule = () => {
        saveCurrentNodeData(); 
        const node = customModel.nodes[editingNodeIdx];
        const others = customModel.nodes.filter(n => n.id !== node.id);
        if (others.length > 0) {
            node.overflow.push({ to: others[0].id, rate: 0.5 });
            renderOverflowRules(editingNodeIdx); 
        }
    };

    window.updateOverflow = (rIdx, field, val) => {
        customModel.nodes[editingNodeIdx].overflow[rIdx][field] = field === 'rate' ? parseFloat(val) : val;
    };

    window.removeOverflow = (rIdx) => {
        saveCurrentNodeData();
        customModel.nodes[editingNodeIdx].overflow.splice(rIdx, 1);
        renderOverflowRules(editingNodeIdx);
    };

    // Funzioni per disegnare la mappa del modello (Layout ad albero/gerarchico)
function drawNetwork() {
    const netCanvas = document.getElementById('networkCanvas');
    if (!netCanvas) return;
    const netCtx = netCanvas.getContext('2d');
    const w = netCanvas.width;
    
    const nodes = customModel.nodes;
    const edges = customModel.edges;
    if (nodes.length === 0) return;
    
    // 1. Calcolo profondità (gerarchia) tramite esplorazione da cima a fondo (BFS)
    const adj = {};
    nodes.forEach(n => adj[n.id] = []);
    edges.forEach(e => adj[e.from].push(e.to));
    
    const depths = {};
    nodes.forEach(n => depths[n.id] = -1);
    
    // Partiamo sempre dal primo nodo impostato dall'utente
    let queue = [nodes[0].id];
    depths[nodes[0].id] = 0;
    
    while(queue.length > 0) {
        let curr = queue.shift();
        adj[curr].forEach(neighbor => {
            if(depths[neighbor] === -1) {
                depths[neighbor] = depths[curr] + 1;
                queue.push(neighbor);
            }
        });
    }
    
    // Assegna profondità 0 ai compartimenti non raggiungibili dal primo 
    // (es. se crei un secondo flusso totalmente separato)
    nodes.forEach(n => {
        if(depths[n.id] === -1) depths[n.id] = 0;
    });

    // 2. Raggruppa i nodi per livello (profondità)
    const levels = {};
    let maxDepth = 0;
    nodes.forEach(n => {
        const d = depths[n.id];
        if(!levels[d]) levels[d] = [];
        levels[d].push(n);
        if(d > maxDepth) maxDepth = d;
    });

    // 3. Adatta altezza del canvas in base alla ramificazione
    const topMargin = 30;
    const verticalSpacing = 60;
    const reqHeight = topMargin * 2 + maxDepth * verticalSpacing;
    netCanvas.height = Math.max(200, reqHeight);
    const h = netCanvas.height;
    
    netCtx.clearRect(0, 0, w, h);
    netCtx.font = 'bold 13px Arial';
    
    // 4. Assegna le coordinate finali 
    const nodePositions = {};
    for(let d = 0; d <= maxDepth; d++) {
        if(!levels[d]) continue;
        const count = levels[d].length;
        levels[d].forEach((node, idx) => {
            nodePositions[node.id] = {
                x: (w / (count + 1)) * (idx + 1),
                y: topMargin + d * verticalSpacing,
                color: node.color
            };
        });
    }

    // 5. Disegna gli archi
    edges.forEach(edge => {
        const posFrom = nodePositions[edge.from];
        const posTo = nodePositions[edge.to];
        if (!posFrom || !posTo) return;
        
        const dx = posTo.x - posFrom.x;
        const dy = posTo.y - posFrom.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        // Stabilisce quando curvare un tratto 
        // Si curva se c'è un doppio senso o se la freccia salta un livello (o torna in alto)
        const hasReverse = edges.some(e => e.from === edge.to && e.to === edge.from);
        const isBackwardOrSkip = depths[edge.to] <= depths[edge.from] || Math.abs(depths[edge.to] - depths[edge.from]) > 1;
        
        let curveOffset = 0;
        if (hasReverse) {
            curveOffset = 18;
        } else if (isBackwardOrSkip) {
            // Se torna indietro o salta un livello, spingiamo la curva verso l'esterno del canvas
            // per evitare che tagli a metà i nodi centrali creando illusioni ottiche
            curveOffset = (posFrom.x < w / 2) ? -65 : 65;
            if (posFrom.x === w/2 && posTo.x === w/2) curveOffset = 65;
        }
        
        const nx = -dy / dist;
        const ny = dx / dist;
        const midX = (posFrom.x + posTo.x) / 2;
        const midY = (posFrom.y + posTo.y) / 2;
        const cpX = midX + nx * curveOffset;
        const cpY = midY + ny * curveOffset;
        
        const angleEnd = Math.atan2(posTo.y - cpY, posTo.x - cpX);
        
        const textWidth = netCtx.measureText(edge.to).width;
        const rectW = Math.max(34, textWidth + 12);
        const rectH = 22;
        
        const absCos = Math.abs(Math.cos(angleEnd));
        const absSin = Math.abs(Math.sin(angleEnd));
        const distToEdgeX = (rectW / 2) / Math.max(absCos, 0.001);
        const distToEdgeY = (rectH / 2) / Math.max(absSin, 0.001);
        const targetOffset = Math.min(distToEdgeX, distToEdgeY) + 3; 

        const startX = posFrom.x;
        const startY = posFrom.y;
        const endX = posTo.x - targetOffset * Math.cos(angleEnd);
        const endY = posTo.y - targetOffset * Math.sin(angleEnd);
        
        netCtx.beginPath();
        netCtx.moveTo(startX, startY);
        if (curveOffset > 0) {
            netCtx.quadraticCurveTo(cpX, cpY, endX, endY);
        } else {
            netCtx.lineTo(endX, endY);
        }
        
        netCtx.strokeStyle = '#00aaff';
        netCtx.setLineDash(edge.type === 'contatto' ? [5, 5] : []);
        netCtx.lineWidth = 2;
        netCtx.stroke();
        
        const headlen = 8;
        netCtx.beginPath();
        netCtx.moveTo(endX, endY);
        netCtx.lineTo(endX - headlen * Math.cos(angleEnd - Math.PI / 6), endY - headlen * Math.sin(angleEnd - Math.PI / 6));
        netCtx.lineTo(endX - headlen * Math.cos(angleEnd + Math.PI / 6), endY - headlen * Math.sin(angleEnd + Math.PI / 6));
        netCtx.lineTo(endX, endY);
        netCtx.fillStyle = netCtx.strokeStyle;
        netCtx.fill();
        netCtx.setLineDash([]);
    });
    
    // 6. Disegna i nodi (Rettangoli arrotondati adattivi)
    nodes.forEach(node => {
        const pos = nodePositions[node.id];
        const textWidth = netCtx.measureText(node.id).width;
        const rectW = Math.max(34, textWidth + 12);
        const rectH = 22;
        const rectX = pos.x - rectW / 2;
        const rectY = pos.y - rectH / 2;
        
        netCtx.beginPath();
        if (netCtx.roundRect) {
            netCtx.roundRect(rectX, rectY, rectW, rectH, 6);
        } else {
            netCtx.rect(rectX, rectY, rectW, rectH); // Fallback browser obsoleti
        }
        netCtx.fillStyle = pos.color;
        netCtx.fill();
        netCtx.strokeStyle = '#333';
        netCtx.lineWidth = 1;
        netCtx.stroke();
        
        netCtx.fillStyle = '#c8d8e8';
        netCtx.textAlign = 'center';
        netCtx.textBaseline = 'middle';
        netCtx.fillText(node.id, pos.x, pos.y);
    });
}

// Sequenza colori predefinita
const PREDEFINED_COLORS = [
    '#3498db', // Blu (S)
    '#e74c3c', // Rosso (I)
    '#2ecc71', // Verde
    '#f1c40f', // Giallo
    '#ff9ff3', // Rosa
    '#48dbfb', // Celeste
    '#ff9f43', // Arancione
    '#9b59b6', // Viola
    '#795548', // Marrone
    '#f5f5dc', // Beige
    '#ffffff', // Bianco
    '#000000'  // Nero
];

function getNextColor(index) {
    if (index < PREDEFINED_COLORS.length) {
        return PREDEFINED_COLORS[index];
    }
    // Colori casuali di fallback se si superano i 12 compartimenti
    return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
}

// Funzioni di editing
window.updateNode = (idx, field, val) => { 
    if (field === 'isStatic' || field === 'isIsolated') {
        customModel.nodes[idx][field] = val;
        return;
    }
    if (field === 'id') {
        const oldId = customModel.nodes[idx].id;
        customModel.nodes[idx].id = val;
        
        // Aggiorna gli archi che puntavano al vecchio nome
        customModel.edges.forEach(edge => {
            if (edge.from === oldId) edge.from = val;
            if (edge.to === oldId) edge.to = val;
        });
        
        // Aggiorna anche le regole di eccedenza (overflow) per evitare "fantasmi"
        customModel.nodes.forEach(n => {
            if (n.overflow) {
                n.overflow.forEach(rule => {
                    if (rule.to === oldId) rule.to = val;
                });
            }
        });

        // Aggiorna anche le regole di nascita
        if (customModel.births) {
            customModel.births.forEach(b => {
                if (b.p1 === oldId) b.p1 = val;
                if (b.p2 === oldId) b.p2 = val;
                if (b.child === oldId) b.child = val;
            });
        }
        
        renderEditor(); // Ridisegna l'editor per aggiornare le tendine
    } else {
        customModel.nodes[idx][field] = (field === 'init' ? parseInt(val) : val); 
        drawNetwork();
    }
};

window.removeNode = (idx) => { 
    const removedId = customModel.nodes[idx].id;
    customModel.nodes.splice(idx, 1); 
    customModel.edges = customModel.edges.filter(e => e.from !== removedId && e.to !== removedId);
    renderEditor(); 
};

window.addCompartment = () => {
    let newId = '';
    let charCode = 65; // Parte dalla lettera 'A'
    
    // Scorre l'alfabeto finché non trova una lettera non ancora utilizzata
    while (customModel.nodes.some(n => n.id === String.fromCharCode(charCode))) {
        charCode++;
    }
    
    // Se esaurisce l'alfabeto passa a un nome numerico casuale
    newId = charCode <= 90 ? String.fromCharCode(charCode) : 'N' + Math.floor(Math.random() * 1000);
    
    customModel.nodes.push({ id: newId, label: 'Nuovo', color: getNextColor(customModel.nodes.length), init: 0, isStatic: false, isIsolated: false });
    renderEditor();
};

window.addEdge = () => {
    // Troviamo la prima coppia (from, to) valida e non ancora utilizzata
    for (let i = 0; i < customModel.nodes.length; i++) {
        const fromId = customModel.nodes[i].id;
        const existingTargets = customModel.edges.filter(e => e.from === fromId).map(e => e.to);
        const possibleTargets = customModel.nodes.filter(n => n.id !== fromId && !existingTargets.includes(n.id));
        
        if (possibleTargets.length > 0) {
            customModel.edges.push({ from: fromId, to: possibleTargets[0].id, type: 'spontaneo', rate: 0.1 });
            renderEditor();
            return;
        }
    }
    alert("Hai già creato tutti i flussi possibili tra i compartimenti esistenti.");
};

window.removeEdge = (idx) => { customModel.edges.splice(idx, 1); renderEditor(); };

window.updateEdge = (idx, field, val) => { 
    customModel.edges[idx][field] = (field === 'rate' ? parseFloat(val) : val); 
    
    if (field === 'from') {
        const newFrom = customModel.edges[idx].from;
        const otherTargets = customModel.edges.filter((e, i) => i !== idx && e.from === newFrom).map(e => e.to);
        const availableTargets = customModel.nodes.filter(n => n.id !== newFrom && !otherTargets.includes(n.id));
        
        if (availableTargets.length > 0) {
            // Se la destinazione attuale non è valida per la nuova origine, la aggiorniamo
            if (newFrom === customModel.edges[idx].to || otherTargets.includes(customModel.edges[idx].to)) {
                customModel.edges[idx].to = availableTargets[0].id;
            }
        }
        renderEditor();
    } else if (field === 'to' || field === 'type') {
        renderEditor();
    } else {
        drawNetwork();
    }
};

    // Event Listeners aggiornati
    document.getElementById('modelSelect').addEventListener('change', toggleEditorView);
    document.getElementById('addCompBtn').addEventListener('click', addCompartment);
    document.getElementById('addFlowBtn').addEventListener('click', addEdge);

    document.getElementById('restartBtn').addEventListener('click', startSimulation);
    document.getElementById('pauseBtn').addEventListener('click', togglePause);

    // Logica per aggiornare la visuale del grafico muovendo lo slider
    const chartScroller = document.getElementById('chartScroller');
    if (chartScroller) {
        chartScroller.addEventListener('input', (e) => {
            const startDay = parseInt(e.target.value);
            const windowSize = 100;
            if (chart) {
                chart.options.scales.x.min = startDay;
                chart.options.scales.x.max = startDay + windowSize;
                chart.update();
            }
        });
    }

    // Popup informazioni parametri
    function updateParamsPopup() {
        const model = document.getElementById('modelSelect').value;
        const popup = document.getElementById('paramsPopup');
        const params = MODEL_PARAMS[model];
        if (!params) { popup.innerHTML = ''; return; }
        let html = `<div class="popup-title">${model} &mdash; Parametri</div><table>`;
        params.forEach(p => {
            html += `<tr><td>${p.sym}</td><td>${p.desc}</td></tr>`;
        });
        html += '</table>';
        popup.innerHTML = html;
    }

    document.getElementById('paramsInfoBtn').addEventListener('click', function(e) {
        const popup = document.getElementById('paramsPopup');
        const rect = this.getBoundingClientRect();
        popup.style.top  = (rect.bottom + 6) + 'px';
        // Allinea a destra del bottone, ma non uscire dallo schermo
        const left = Math.min(rect.left, window.innerWidth - 396);
        popup.style.left = left + 'px';
        popup.classList.toggle('visible');
        e.stopPropagation();
    });

    document.addEventListener('click', function() {
        document.getElementById('paramsPopup').classList.remove('visible');
    });

    // Inizializzazione
    toggleEditorView();
    startSimulation();
</script>
